<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Phone</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    #simulator {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* width matters: #device-frame is a flex item, so without it it shrinks
       to its content and #phone's width:100% collapses to a sliver. */
    #device-frame { position: relative; width: 100%; }
    #phone {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #notch, .home-indicator, .side-btn { display: none; }

    /* iOS-simulator device frame, shown on desktop/tablet viewports only -
       real phones already have a device frame (and their own home
       indicator/notch drawn by the OS), so below this breakpoint #phone
       just fills the viewport edge-to-edge as normal, frame-free. */
    @media (min-width: 700px) {
      html, body { overflow: auto; }
      body { background: radial-gradient(circle at 50% 30%, #302f33, #08080a 75%); }
      #simulator { padding: 3rem 0; }

      #device-frame {
        width: auto;
        padding: 16px;
        border-radius: 64px;
        background: linear-gradient(155deg, #4a4a4d, #232325 35%, #050505 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 50px 100px rgba(0, 0, 0, 0.65);
      }
      #phone {
        width: 393px;
        height: 852px;
        max-width: none;
        border-radius: 50px;
        box-shadow: 0 0 0 2px #000;
      }

      #notch {
        display: block;
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 30px;
        background: #050505;
        border-radius: 18px;
        z-index: 50;
      }
      .home-indicator {
        display: block;
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.9);
        z-index: 50;
      }

      /* hardware buttons, protruding from the outer frame */
      .side-btn {
        display: block;
        position: absolute;
        background: linear-gradient(90deg, #1c1c1e, #333336);
      }
      .side-btn.mute-switch { left: -2px; top: 122px; width: 4px; height: 28px; border-radius: 2px 0 0 2px; }
      .side-btn.vol-up      { left: -2px; top: 172px; width: 4px; height: 58px; border-radius: 2px 0 0 2px; }
      .side-btn.vol-down    { left: -2px; top: 240px; width: 4px; height: 58px; border-radius: 2px 0 0 2px; }
      .side-btn.power-btn   { right: -2px; top: 196px; width: 4px; height: 92px; border-radius: 0 2px 2px 0; }

      /* clear the fake notch: a real phone's env(safe-area-inset-top)
         already does this, but that resolves to 0 in a desktop browser. */
      .status-bar { padding-top: 46px; }
    }

    /* status bar - fixed chrome above the screen stack, always visible */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(0.6rem, env(safe-area-inset-top)) 1.4rem 0.3rem;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      background: #000;
    }

    /* screens - stacked inside #screens, which sits below the status bar,
       not inside #phone directly (screens used to cover the whole phone,
       including the status bar and notch). */
    #screens { position: relative; flex: 1; overflow: hidden; }

    /* real phones draw their own status bar, so ours would just be a
       duplicate clock - drop it and keep only the safe-area inset it gave. */
    @media (max-width: 699px) {
      .status-bar { display: none; }
      #screens { margin-top: env(safe-area-inset-top); }
    }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .screen.active { opacity: 1; pointer-events: auto; }

    /* ---- contacts list screen ---- */
    #screen-contacts { background: #000; }
    .contacts-header {
      padding: 0.5rem 1.1rem 0.75rem;
      flex-shrink: 0;
    }
    .contacts-header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      margin: 0.4rem 0 0;
    }
    .contacts-list { flex: 1; overflow-y: auto; padding: 0 1.1rem; }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.6rem 0.2rem;
      border-bottom: 1px solid #1c1c1e;
    }
    .contact-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(160deg, #6b6f76, #3a3c40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: #eee;
      flex-shrink: 0;
    }
    .contact-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .contact-name { font-size: 1.08rem; font-weight: 500; }
    .contact-sub { font-size: 0.85rem; color: #8e8e93; margin-top: 0.1rem; }
    .call-cta {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #34c759;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .call-cta:active { filter: brightness(1.15); }
    .contact-actions { display: flex; gap: 0.6rem; flex-shrink: 0; }

    /* ---- FaceTime in-call: full-bleed video with floating controls ---- */
    #screen-facetime {
      background: radial-gradient(circle at 50% 30%, #3a4a63 0%, #141b27 75%);
      align-items: center;
      justify-content: center;
    }
    .ft-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 0%;
    }

    /* your own camera, like real FaceTime: full-screen while it rings, then
       a mirrored picture-in-picture. Local preview only - never sent. */
    .self-view {
      position: absolute;
      right: 14px;
      bottom: calc(max(1.6rem, env(safe-area-inset-bottom)) + 88px);
      width: 100px;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      object-fit: cover;
      transform: scaleX(-1);
      background: #1c1c1e;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 5;
    }
    .ring-self {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }
    #screen-calling.video .ring-self { display: block; }
    #screen-calling.video::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.45));
    }
    #screen-calling.video .call-avatar-wrap { display: none; }
    #screen-calling > :not(video) { position: relative; z-index: 1; }
    .cam-off { display: none !important; }

    /* Live Captions, styled after iOS: frosted dark panel, speaker label,
       newest words at the bottom, older lines scrolling off the top */
    .captions {
      width: 100%;
      max-width: 360px;
      max-height: 7.6em;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.45rem;
      padding: 0.7rem 0.9rem;
      border-radius: 1.1rem;
      background: rgba(28, 28, 30, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: left;
      font-size: 0.98rem;
      line-height: 1.3;
      -webkit-mask-image: linear-gradient(transparent, #000 1.4em);
      mask-image: linear-gradient(transparent, #000 1.4em);
    }
    .captions:empty { visibility: hidden; }
    .caption-who { display: block; font-size: 0.75rem; font-weight: 600; color: #8e8e93; margin-bottom: 0.1rem; }
    .caption-text { color: #fff; }
    .caption-line.interim .caption-text { color: #d1d1d6; }
    #screen-connected .captions { margin: 0 auto; }
    #screen-facetime .captions {
      position: absolute;
      top: 4.4rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      z-index: 4;
    }
    .ft-top {
      position: absolute;
      top: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .ft-name { font-size: 1.15rem; font-weight: 600; }
    .ft-timer { font-size: 0.85rem; color: #e5e5ea; margin-top: 0.15rem; }
    .ft-controls {
      position: absolute;
      left: 50%;
      bottom: max(1.6rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 0.9rem;
      padding: 0.7rem 0.9rem;
      border-radius: 2rem;
      background: rgba(40, 40, 44, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .ft-controls .ctrl-circle { width: 52px; height: 52px; }
    .ft-controls .end-btn { width: 52px; height: 52px; box-shadow: none; }

    /* ---- calling / in-call screens share this layout ---- */
    .call-screen {
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1.5rem max(2.2rem, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 20%, #2c2c2e 0%, #000 72%);
      text-align: center;
    }
    .call-identity { display: flex; flex-direction: column; align-items: center; margin-top: 2.5rem; }
    .call-avatar-wrap { position: relative; width: 132px; height: 132px; margin-bottom: 1.4rem; }
    .call-avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: linear-gradient(160deg, #7a7f88, #35373b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }
    .ring-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.45);
      opacity: 0;
      animation: none;
    }
    #screen-calling .ring-pulse { animation: pulse 1.8s ease-out infinite; }
    #screen-calling .ring-pulse:nth-child(2) { animation-delay: 0.6s; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .call-name { font-size: 1.7rem; font-weight: 500; margin-bottom: 0.35rem; }
    .call-status { font-size: 1.02rem; color: #a8a8ac; min-height: 1.3em; }

    /* control grid (in-call) */
    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.4rem 1.6rem;
      width: 100%;
      max-width: 320px;
      margin-bottom: 2.2rem;
    }
    .ctrl-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
    }
    .ctrl-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .ctrl-btn:active .ctrl-circle { background: rgba(255,255,255,0.22); }
    .ctrl-btn.on .ctrl-circle { background: #fff; }
    .ctrl-btn.on .ctrl-circle svg { stroke: #000; fill: #000; }
    .ctrl-btn.disabled { opacity: 0.35; pointer-events: none; }
    .ctrl-label { font-size: 0.8rem; color: #d0d0d3; }
    .ctrl-btn.on .ctrl-label { color: #fff; }

    .end-row { display: flex; justify-content: center; width: 100%; }
    .end-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ff3b30;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(255,59,48,0.35);
    }
    .end-btn:active { background: #d6291f; }

    /* ---- call ended ---- */
    #screen-ended .call-status { color: #8e8e93; }

    .hidden-audio { display: none; }
  </style>
</head>
<body>
  <div id="simulator">
  <div id="device-frame">
    <div class="side-btn mute-switch"></div>
    <div class="side-btn vol-up"></div>
    <div class="side-btn vol-down"></div>
    <div class="side-btn power-btn"></div>
  <div id="phone">
    <div id="notch"></div>
    <div class="home-indicator"></div>
    <div class="status-bar">
      <span id="clock">9:41</span>
      <span></span>
    </div>

    <div id="screens">
    <!-- Contact detail (iOS Contact card, one contact only) -->
    <section id="screen-contacts" class="screen active">
      <div class="contacts-header"><h1>Contacts</h1></div>
      <div class="contacts-list">
        <div class="contact-row">
          <div class="contact-avatar">A</div>
          <div class="contact-meta">
            <div class="contact-name">Alex</div>
            <div class="contact-sub">mobile</div>
          </div>
          <div class="contact-actions">
            <button class="call-cta" id="facetime-btn" aria-label="FaceTime Alex">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                <rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M17 10.2 21.5 7v10L17 13.8Z"/>
              </svg>
            </button>
            <button class="call-cta" id="call-btn" aria-label="Call Alex">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4.9 3 4.4 3.4 4 4 4h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8Z" fill="#fff"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Calling / ringing -->
    <section id="screen-calling" class="screen call-screen">
      <video class="ring-self" id="ring-self" autoplay muted playsinline></video>
      <div class="call-identity">
        <div class="call-avatar-wrap">
          <div class="ring-pulse"></div>
          <div class="ring-pulse"></div>
          <div class="call-avatar">A</div>
        </div>
        <div class="call-name">Alex</div>
        <div class="call-status">calling&hellip;</div>
      </div>
      <div class="end-row">
        <button class="end-btn" id="cancel-btn" aria-label="Cancel call">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M21 15.5c-1.4 0-2.7-.2-3.9-.6a1 1 0 0 0-1 .2l-1.7 1.7a15.5 15.5 0 0 1-6.9-6.9l1.7-1.7c.3-.3.4-.7.2-1-.4-1.2-.6-2.5-.6-3.9 0-.6-.4-1-1-1H4a1 1 0 0 0-1 1C3 13.7 10.3 21 19.5 21a1 1 0 0 0 1-1v-3.5c0-.6-.4-1-1-1Z" fill="#fff" transform="rotate(135 12 12)"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- In call -->
    <section id="screen-connected" class="screen call-screen">
      <div class="call-identity">
        <div class="call-avatar-wrap">
          <div class="call-avatar">A</div>
        </div>
        <div class="call-name">Alex</div>
        <div class="call-status" id="call-timer">00:00</div>
      </div>

      <div class="captions" aria-live="polite"></div>

      <div>
        <div class="control-grid">
          <button class="ctrl-btn" id="mute-btn">
            <span class="ctrl-circle">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                <path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3"/>
              </svg>
            </span>
            <span class="ctrl-label">mute</span>
          </button>
          <button class="ctrl-btn disabled">
            <span class="ctrl-circle">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <circle cx="8" cy="9" r="0.9" fill="#fff"/><circle cx="12" cy="9" r="0.9" fill="#fff"/><circle cx="16" cy="9" r="0.9" fill="#fff"/>
                <circle cx="8" cy="13" r="0.9" fill="#fff"/><circle cx="12" cy="13" r="0.9" fill="#fff"/><circle cx="16" cy="13" r="0.9" fill="#fff"/>
              </svg>
            </span>
            <span class="ctrl-label">keypad</span>
          </button>
          <button class="ctrl-btn" id="speaker-btn">
            <span class="ctrl-circle">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <path d="M4 10v4h3l4 3.5v-10.5L7 10H4Z"/>
                <path d="M16 9a4 4 0 0 1 0 6M18.5 7a8 8 0 0 1 0 10"/>
              </svg>
            </span>
            <span class="ctrl-label">speaker</span>
          </button>
          <button class="ctrl-btn disabled">
            <span class="ctrl-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 7v6M14 10h6"/>
              </svg>
            </span>
            <span class="ctrl-label">add call</span>
          </button>
          <button class="ctrl-btn disabled">
            <span class="ctrl-circle">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5 21 7.5v9L16 13.5"/>
              </svg>
            </span>
            <span class="ctrl-label">FaceTime</span>
          </button>
          <button class="ctrl-btn disabled">
            <span class="ctrl-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
                <circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
              </svg>
            </span>
            <span class="ctrl-label">contacts</span>
          </button>
        </div>
        <div class="end-row">
          <button class="end-btn" id="hangup-btn" aria-label="End call">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
              <path d="M21 15.5c-1.4 0-2.7-.2-3.9-.6a1 1 0 0 0-1 .2l-1.7 1.7a15.5 15.5 0 0 1-6.9-6.9l1.7-1.7c.3-.3.4-.7.2-1-.4-1.2-.6-2.5-.6-3.9 0-.6-.4-1-1-1H4a1 1 0 0 0-1 1C3 13.7 10.3 21 19.5 21a1 1 0 0 0 1-1v-3.5c0-.6-.4-1-1-1Z" fill="#fff"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- FaceTime in call: lip-synced avatar (see avatar/avatar.js) -->
    <section id="screen-facetime" class="screen">
      <canvas class="ft-video" id="ft-canvas" width="280" height="440"></canvas>
      <video class="self-view" id="ft-self" autoplay muted playsinline></video>
      <div class="ft-top">
        <div class="ft-name">Alex</div>
        <div class="ft-timer" id="ft-timer">00:00</div>
      </div>
      <div class="captions" aria-live="polite"></div>
      <div class="ft-controls">
        <button class="ctrl-btn" id="ft-speaker-btn" aria-label="Speaker">
          <span class="ctrl-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <path d="M4 10v4h3l4 3.5v-10.5L7 10H4Z"/>
              <path d="M16 9a4 4 0 0 1 0 6M18.5 7a8 8 0 0 1 0 10"/>
            </svg>
          </span>
        </button>
        <button class="ctrl-btn" id="ft-cam-btn" aria-label="Camera">
          <span class="ctrl-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5 21 7.5v9L16 13.5"/>
            </svg>
          </span>
        </button>
        <button class="ctrl-btn" id="ft-mute-btn" aria-label="Mute">
          <span class="ctrl-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
              <path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3"/>
            </svg>
          </span>
        </button>
        <button class="end-btn" id="ft-hangup-btn" aria-label="End FaceTime">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Ended -->
    <section id="screen-ended" class="screen call-screen">
      <div class="call-identity">
        <div class="call-avatar-wrap">
          <div class="call-avatar">A</div>
        </div>
        <div class="call-name">Alex</div>
        <div class="call-status">Call Ended</div>
      </div>
      <div></div>
    </section>
    </div>
  </div>
  </div>
  </div>

  <script type="module">
    import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js@1.13.1";
    import { SmallWebRTCTransport } from "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.10.8";

    const screens = {
      contacts: document.getElementById("screen-contacts"),
      calling: document.getElementById("screen-calling"),
      connected: document.getElementById("screen-connected"),
      facetime: document.getElementById("screen-facetime"),
      ended: document.getElementById("screen-ended"),
    };
    const callStatusEl = screens.calling.querySelector(".call-status");
    const timerEls = [document.getElementById("call-timer"), document.getElementById("ft-timer")];
    // audio-call and FaceTime screens each have their own mute/speaker
    // buttons; they share one state and are toggled together.
    const muteBtns = [document.getElementById("mute-btn"), document.getElementById("ft-mute-btn")];
    const speakerBtns = [document.getElementById("speaker-btn"), document.getElementById("ft-speaker-btn")];

    function showScreen(name) {
      for (const el of Object.values(screens)) el.classList.remove("active");
      screens[name].classList.add("active");
    }

    // iOS-style status bar clock.
    function tickClock() {
      const el = document.getElementById("clock");
      const now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    tickClock();
    setInterval(tickClock, 15000);

    // North-American ringback tone (440Hz + 480Hz, ~2s on / 4s off), synthesized
    // so the call has an audible ring with no external audio asset to ship.
    let ringCtx = null;
    let ringTimer = null;
    function startRingback() {
      ringCtx = new (window.AudioContext || window.webkitAudioContext)();
      const cycle = () => {
        if (!ringCtx) return;
        const gain = ringCtx.createGain();
        gain.gain.value = 0.06;
        gain.connect(ringCtx.destination);
        const oscA = ringCtx.createOscillator();
        const oscB = ringCtx.createOscillator();
        oscA.frequency.value = 440;
        oscB.frequency.value = 480;
        oscA.connect(gain);
        oscB.connect(gain);
        oscA.start();
        oscB.start();
        oscA.stop(ringCtx.currentTime + 2);
        oscB.stop(ringCtx.currentTime + 2);
      };
      cycle();
      ringTimer = setInterval(cycle, 6000);
    }
    function stopRingback() {
      if (ringTimer) clearInterval(ringTimer);
      ringTimer = null;
      if (ringCtx) {
        ringCtx.close();
        ringCtx = null;
      }
    }

    // North-American busy signal (480Hz + 620Hz, 0.5s on / 0.5s off), played
    // like a carrier does when every line (container) is taken.
    async function playBusyTone(cycles = 4) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const gain = ctx.createGain();
      gain.gain.value = 0.06;
      gain.connect(ctx.destination);
      for (let i = 0; i < cycles; i++) {
        const start = ctx.currentTime + i;
        for (const freq of [480, 620]) {
          const osc = ctx.createOscillator();
          osc.frequency.value = freq;
          osc.connect(gain);
          osc.start(start);
          osc.stop(start + 0.5);
        }
      }
      await delay(cycles * 1000);
      ctx.close();
    }

    let client = null;
    let remoteAudioEl = null;
    let speakerOn = false;
    let muted = false;
    let timerInterval = null;
    let callSeconds = 0;
    let callActive = false;
    let connectedScreenShown = false;

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function startTimer() {
      callSeconds = 0;
      for (const el of timerEls) el.textContent = "00:00";
      timerInterval = setInterval(() => {
        callSeconds += 1;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const s = String(callSeconds % 60).padStart(2, "0");
        for (const el of timerEls) el.textContent = `${m}:${s}`;
      }, 1000);
    }

    // FaceTime avatar, loaded lazily so audio calls never fetch the ML runtime.
    let avatarModule = null;
    let talkingHead = null;
    let isVideoCall = false;
    // created in the FaceTime tap itself so it's allowed to run (see avatar.js)
    let lipSyncCtx = null;

    // Your own camera for FaceTime - a local preview only (the pipecat client
    // keeps enableCam off, so nothing is sent to the tutor).
    let selfStream = null;
    let cameraOff = false;
    const selfViews = [document.getElementById("ring-self"), document.getElementById("ft-self")];
    const camBtn = document.getElementById("ft-cam-btn");
    async function startSelfView() {
      cameraOff = false;
      camBtn.classList.remove("on");
      try {
        selfStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
          audio: false,
        });
        if (!callActive) return stopSelfView();
        for (const v of selfViews) {
          v.srcObject = selfStream;
          v.classList.remove("cam-off");
        }
      } catch (e) {
        // no camera or permission denied: FaceTime still works, just no preview
        console.warn("camera unavailable", e);
        for (const v of selfViews) v.classList.add("cam-off");
      }
    }
    // Live Captions. Alex's words arrive one by one in sync with the audio
    // (bot-tts-text, from ElevenLabs word timestamps); yours arrive as
    // interim transcripts that are then finalised (user-transcription).
    const captionEls = document.querySelectorAll(".captions");
    let captions = []; // { who, text, interim }
    function renderCaptions() {
      const html = captions.slice(-3).map((c) => {
        const who = document.createElement("span");
        who.className = "caption-who";
        who.textContent = c.who;
        const text = document.createElement("span");
        text.className = "caption-text";
        text.textContent = c.text + (c.interim ? " " + c.interim : "");
        const line = document.createElement("div");
        line.className = "caption-line" + (c.interim ? " interim" : "");
        line.append(who, text);
        return line;
      });
      for (const el of captionEls) el.replaceChildren(...html.map((n) => n.cloneNode(true)));
    }
    function currentLine(who) {
      let last = captions[captions.length - 1];
      if (!last || last.who !== who) {
        last = { who, text: "", interim: "" };
        captions.push(last);
        if (captions.length > 20) captions.shift();
      }
      return last;
    }
    function captionBotWord(word) {
      const w = (word || "").trim();
      if (!w) return;
      const line = currentLine("Alex");
      line.text += (line.text && !/^[,.!?;:]/.test(w) ? " " : "") + w;
      renderCaptions();
    }
    function captionUser({ text, final }) {
      const t = (text || "").trim();
      if (!t) return;
      const line = currentLine("You");
      if (final) {
        line.text += (line.text ? " " : "") + t;
        line.interim = "";
      } else {
        line.interim = t;
      }
      renderCaptions();
    }
    function resetCaptions() {
      captions = [];
      renderCaptions();
    }

    // Keep the screen awake for the whole call. On iPhone the screen
    // otherwise auto-locks mid-call (nobody touches it while talking), iOS
    // suspends the page, and the WebRTC connection dies - the call drops.
    let wakeLock = null;
    async function acquireWakeLock() {
      if (!callActive || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) {
        console.warn("wake lock unavailable", e);
      }
    }
    function releaseWakeLock() {
      wakeLock?.release().catch(() => {});
      wakeLock = null;
    }
    // the lock is dropped whenever the page is hidden; take it back on return
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") acquireWakeLock();
    });

    function stopSelfView() {
      selfStream?.getTracks().forEach((t) => t.stop());
      selfStream = null;
      for (const v of selfViews) v.srcObject = null;
    }
    function loadAvatar() {
      avatarModule ??= import("./avatar/avatar.js").then((mod) => {
        mod.preloadAvatar().catch((e) => console.error("avatar preload failed", e));
        return mod;
      });
      return avatarModule;
    }
    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    }

    async function endCall(reason, { busy = false } = {}) {
      if (!callActive) return;
      callActive = false;
      stopRingback();
      stopTimer();
      talkingHead?.stop();
      talkingHead = null;
      stopSelfView();
      releaseWakeLock();
      resetCaptions();
      screens.calling.classList.remove("video");
      if (client) {
        try {
          await client.disconnect();
        } catch (_) {
          /* already gone */
        }
      }
      if (remoteAudioEl) {
        remoteAudioEl.remove();
        remoteAudioEl = null;
      }
      screens.ended.querySelector(".call-status").textContent = reason || "Call Ended";
      showScreen("ended");
      if (busy) {
        await playBusyTone();
      } else {
        await delay(1200);
      }
      showScreen("contacts");
    }

    async function startCall({ video = false } = {}) {
      callActive = true;
      isVideoCall = video;
      connectedScreenShown = false;
      muted = false;
      speakerOn = false;
      for (const b of [...muteBtns, ...speakerBtns]) b.classList.remove("on");
      callStatusEl.textContent = video ? "FaceTime…" : "calling…";
      screens.calling.classList.toggle("video", video);
      showScreen("calling");
      acquireWakeLock();
      startRingback();
      // fetch the avatar runtime + model while it rings (~6MB, a few seconds)
      if (video) loadAvatar();

      // Matches pipecat's own prebuilt client config: wait for full ICE
      // gathering (including TURN relay candidates) before sending the
      // offer, instead of relying on trickle ICE - more reliable through
      // a TURN relay.
      const transport = new SmallWebRTCTransport({ waitForICEGathering: true });
      client = new PipecatClient({
        transport,
        enableMic: true,
        enableCam: false,
        callbacks: {
          // onBotReady only means the pipeline is wired up, not that the
          // bot has actually said anything yet - cold start + LLM + TTS
          // can take several seconds beyond that. Keep ringing until the
          // bot actually starts speaking, so the ring covers that gap
          // instead of dropping into a silent "connected" screen.
          onBotStartedSpeaking: () => {
            if (!callActive || connectedScreenShown) return;
            connectedScreenShown = true;
            stopRingback();
            showScreen(isVideoCall ? "facetime" : "connected");
            startTimer();
          },
          onBotTtsText: (data) => captionBotWord(data?.text),
          onUserTranscript: (data) => captionUser(data || {}),
          onDisconnected: () => {
            endCall("Call Ended");
          },
          onError: (error) => {
            console.error(error);
            // the worker answers /start with {"info": "line_busy"} when no
            // container is free, which surfaces here as the error message.
            if (error?.data?.message === "line_busy") {
              endCall("Line Busy", { busy: true });
            } else {
              endCall("Call Failed");
            }
          },
        },
      });

      client.on("trackStarted", (track, participant) => {
        if (!participant?.local && track.kind === "audio") {
          remoteAudioEl = document.createElement("audio");
          remoteAudioEl.className = "hidden-audio";
          remoteAudioEl.autoplay = true;
          remoteAudioEl.volume = speakerOn ? 1.0 : 0.75;
          remoteAudioEl.srcObject = new MediaStream([track]);
          document.body.appendChild(remoteAudioEl);
          if (isVideoCall) startTalkingHead(track);
        }
      });

      // Ring for at least ~2 cycles even on a fast connection, so the call
      // always feels like a real phone call rather than an instant pickup.
      const MIN_RING_MS = 3200;
      try {
        await Promise.all([
          client.startBotAndConnect({
            endpoint: "/start",
            requestData: { transport: "webrtc", enableDefaultIceServers: true },
          }),
          delay(MIN_RING_MS),
        ]);
      } catch (error) {
        console.error(error);
        endCall("Call Failed");
      }
    }

    // The bot's audio track arrives while it's still ringing, so the avatar
    // is already rendering (lips following the greeting) when the FaceTime
    // screen appears on the first spoken word.
    async function startTalkingHead(track) {
      try {
        const { TalkingHead } = await loadAvatar();
        if (!callActive) return;
        talkingHead?.stop();
        talkingHead = new TalkingHead(document.getElementById("ft-canvas"));
        talkingHead.setAudioTrack(track, lipSyncCtx);
        await talkingHead.start();
      } catch (e) {
        // audio keeps working; only the video is missing
        console.error("avatar failed to start", e);
      }
    }

    document.getElementById("call-btn").addEventListener("click", () => startCall());
    document.getElementById("facetime-btn").addEventListener("click", () => {
      lipSyncCtx ??= new (window.AudioContext || window.webkitAudioContext)();
      lipSyncCtx.resume();
      startCall({ video: true });
      startSelfView();
    });

    camBtn.addEventListener("click", () => {
      if (!selfStream) return;
      cameraOff = !cameraOff;
      selfStream.getVideoTracks().forEach((t) => (t.enabled = !cameraOff));
      camBtn.classList.toggle("on", cameraOff);
      document.getElementById("ft-self").classList.toggle("cam-off", cameraOff);
    });
    document.getElementById("cancel-btn").addEventListener("click", () => endCall("Call Ended"));
    document.getElementById("hangup-btn").addEventListener("click", () => endCall("Call Ended"));
    document.getElementById("ft-hangup-btn").addEventListener("click", () => endCall("FaceTime Ended"));

    for (const btn of muteBtns) {
      btn.addEventListener("click", () => {
        if (!client) return;
        muted = !muted;
        client.enableMic(!muted);
        for (const b of muteBtns) b.classList.toggle("on", muted);
      });
    }

    for (const btn of speakerBtns) {
      btn.addEventListener("click", () => {
        speakerOn = !speakerOn;
        for (const b of speakerBtns) b.classList.toggle("on", speakerOn);
        if (remoteAudioEl) remoteAudioEl.volume = speakerOn ? 1.0 : 0.75;
      });
    }
  </script>
</body>
</html>
