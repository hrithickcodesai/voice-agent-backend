[project]
name = "voice-agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.68.0",
    "fastapi>=0.115.6",
    "numpy>=2.5.3",
    "pipecat-ai[elevenlabs,openrouter,runner,silero,webrtc]>=1.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
